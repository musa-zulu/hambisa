<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deliveries</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5D45}a:hover{color:#083F2F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F5F2; color: #111714; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 60px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Deliveries</h1>
    <div style="display: flex; gap: 8px">
      <button aria-pressed="true" style="height: 38px; padding: 0 16px; border-radius: 999px; border: 0; background: #111714; color: #fff; font: 700 14px 'Plus Jakarta Sans', system-ui, sans-serif">All</button>
      <button aria-pressed="false" style="height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid #C9CEC8; background: #fff; color: #111714; font: 600 14px 'Plus Jakarta Sans', system-ui, sans-serif">Active · 1</button>
      <button aria-pressed="false" style="height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid #C9CEC8; background: #fff; color: #111714; font: 600 14px 'Plus Jakarta Sans', system-ui, sans-serif">Completed</button>
    </div>
  </header>
  <ul style="list-style: none; margin: 0; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: hidden">
    <sc-for list="{{orders}}" as="o" hint-placeholder-count="5">
      <li>
        <a href="{{o.href}}" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 16px; background: #fff; text-decoration: none; color: #111714">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: {{o.bg}}; color: {{o.fg}}">{{o.status}}</span>
            <span style="font-size: 13px; color: #5B655F">{{o.date}}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 700">{{o.route}}</span>
            <span style="font-size: 13px; color: #5B655F"><span style="font-family: 'JetBrains Mono', monospace">{{o.ref}}</span> · {{o.parcel}}</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #ECEDEB">
            <span style="font-size: 13px; font-weight: 600; color: #3F4943">{{o.pay}}</span>
            <span style="font-size: 15px; font-weight: 800">{{o.fare}}</span>
          </div>
        </a>
      </li>
    </sc-for>
  </ul>
  <nav aria-label="Main" style="height: 84px; box-sizing: border-box; padding: 8px 8px 26px; background: #fff; border-top: 1px solid #E1E4DF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Cus02-Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5B655F; font-size: 12px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Home</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #0B5D45; font-size: 12px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5L12 4l8 3.5v9L12 20l-8-3.5z M4 7.5L12 11l8-3.5M12 11v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Deliveries</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5B655F; font-size: 12px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-4-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Saved</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #5B655F; font-size: 12px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c1.2-4 4-5.5 7.5-5.5s6.3 1.5 7.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const chips = {
  transit: ['#E5EEFB', '#1F4FA3'],
  delivered: ['#E3F1EB', '#0B5D45'],
  failed: ['#FDE7E4', '#A1281B'],
  cancelled: ['#ECEDEB', '#3F4943']
};
const orders = [
  { kind: 'transit', status: '● In transit', date: 'Today, 14:02', route: 'Gardens → Tamboerskloof', ref: 'HB-24817', parcel: 'Documents', pay: 'Paid · Card 4821', fare: 'R 58.00', href: 'Cus05-Tracking.dc.html' },
  { kind: 'delivered', status: '✓ Delivered', date: 'Mon 20 Oct', route: 'Woodstock → Sea Point', ref: 'HB-24533', parcel: 'Small box', pay: 'Paid · Card 4821', fare: 'R 84.00', href: 'Cus07-Completed.dc.html' },
  { kind: 'failed', status: '✕ Not delivered', date: 'Fri 17 Oct', route: 'Gardens → Observatory', ref: 'HB-24390', parcel: 'Documents', pay: 'Refund pending', fare: 'R 72.00', href: '#' },
  { kind: 'cancelled', status: '— Cancelled by you', date: 'Wed 15 Oct', route: 'Gardens → Green Point', ref: 'HB-24211', parcel: 'Food', pay: 'Refunded', fare: 'R 0.00', href: '#' },
  { kind: 'delivered', status: '✓ Delivered', date: 'Tue 14 Oct', route: 'CBD → Claremont', ref: 'HB-24102', parcel: 'Documents', pay: 'Paid · Instant EFT', fare: 'R 96.00', href: '#' }
].map(o => ({ ...o, bg: chips[o.kind][0], fg: chips[o.kind][1] }));
return { orders };
}
}
</script>
</body>
</html>
