<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F5F2; color: #111714; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 58px 16px 16px; background: #111714; color: #fff; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font: 600 14px 'JetBrains Mono', monospace; color: #B9C1BC">HB-24817</span>
      <a href="#" style="color: #F4B400; font-size: 14px; font-weight: 700; min-height: 44px; display: flex; align-items: center">Need help</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="height: 6px; border-radius: 3px; background: #F4B400"></span><span style="font-size: 13px; font-weight: 800">1 · Collect</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="height: 6px; border-radius: 3px; background: #3F4943"></span><span style="font-size: 13px; font-weight: 600; color: #B9C1BC">2 · Deliver</span></div>
    </div>
  </header>

  <div style="flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <section style="background: #fff; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 600; color: #5B655F">Pickup</span>
        <span style="font-size: 20px; font-weight: 800">123 Main Road, Gardens</span>
        <span style="font-size: 14px; color: #3F4943">Musa · ask at reception</span>
      </div>
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px">
        <button style="height: 52px; border: 0; border-radius: 12px; background: #111714; color: #fff; font: 700 15px 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 8.5L16 2l-6.5 14-1.5-6z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>Navigate</button>
        <button aria-label="Call sender" style="height: 52px; border: 1.5px solid #C9CEC8; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h3l1.5 4-2 1.2a8 8 0 004.3 4.3l1.2-2 4 1.5v3a2 2 0 01-2 2A14 14 0 013 5a2 2 0 012-2z" fill="none" stroke="#111714" stroke-width="1.8" stroke-linejoin="round"/></svg></button>

      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #0B5D45; font-weight: 700"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3L13 4.5" fill="none" stroke="#0B5D45" stroke-width="2.2" stroke-linecap="round"/></svg>Arrival recorded 14:12</div>
    </section>

    <section style="background: #fff; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <h1 style="margin: 0; font-size: 17px; font-weight: 800">Check the parcel</h1>
      <label style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #0B5D45; background: #E3F1EB">
        <input type="checkbox" checked style="width: 24px; height: 24px; margin: 0; accent-color: #0B5D45">
        <span style="font-size: 15px; font-weight: 700">1 item · Documents · 0.5 kg</span>
      </label>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="cc1" style="font-size: 14px; font-weight: 700">Collection code from sender</label>
        <div style="display: flex; gap: 8px">
          <input id="cc1" value="7" aria-label="Code digit 1" style="width: 56px; height: 60px; text-align: center; border: 1.5px solid #C9CEC8; border-radius: 12px; font: 700 26px 'JetBrains Mono', monospace; color: #111714; box-sizing: border-box">
          <input value="3" aria-label="Code digit 2" style="width: 56px; height: 60px; text-align: center; border: 1.5px solid #C9CEC8; border-radius: 12px; font: 700 26px 'JetBrains Mono', monospace; color: #111714; box-sizing: border-box">
          <input value="0" aria-label="Code digit 3" style="width: 56px; height: 60px; text-align: center; border: 1.5px solid #C9CEC8; border-radius: 12px; font: 700 26px 'JetBrains Mono', monospace; color: #111714; box-sizing: border-box">
          <input value="5" aria-label="Code digit 4" style="width: 56px; height: 60px; text-align: center; border: 1.5px solid #C9CEC8; border-radius: 12px; font: 700 26px 'JetBrains Mono', monospace; color: #111714; box-sizing: border-box">
          <button aria-label="Scan barcode instead" style="flex: 1; height: 60px; border: 1.5px solid #C9CEC8; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4M7 9v6M10 9v6M13 9v6M16 9v6" fill="none" stroke="#111714" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        </div>
      </div>
    </section>
  </div>

  <footer style="padding: 12px 16px 34px; background: #fff; border-top: 1px solid #E1E4DF; display: flex; flex-direction: column; gap: 6px">
    <a href="Rid04-Active.dc.html" style="height: 64px; border-radius: 16px; background: #0B5D45; color: #fff; text-decoration: none; font-size: 19px; font-weight: 800; display: flex; align-items: center; justify-content: center">Confirm collection</a>
    <button style="height: 48px; border: 0; background: none; font: 700 15px 'Plus Jakarta Sans', system-ui, sans-serif; color: #A1281B">Report a problem with pickup</button>
  </footer>
</div>
</x-dc>
